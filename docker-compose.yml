# Production example: the site behind Caddy (automatic HTTPS). Replace onyq.am with your domain.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_MODE: production
        NEXT_PUBLIC_SITE_URL: https://onyq.am
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - onyq-data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["3000"]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]

volumes:
  onyq-data:
  caddy-data:
  caddy-config:
